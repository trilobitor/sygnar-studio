<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sygnar Studio — brak połączenia</title>
    <style>
      body {
        background: #141414;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 2rem;
      }
      div { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 500; }
      p { font-size: 0.875rem; opacity: 0.7; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div>
      <h1>Brak połączenia ze stacją</h1>
      <p>
        Panel działa tylko wtedy, gdy maszyna Kamila jest włączona i podłączona
        do sieci. Sprawdź swoje połączenie, a jeśli jest w porządku — napisz do
        niego.
      </p>
      <p>Nic nie zginęło: zlecenia, briefy i pliki czekają na stacji.</p>
    </div>
  </body>
</html>
