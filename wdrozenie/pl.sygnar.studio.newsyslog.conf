# Rotacja logów panelu Sygnar Studio.
#
# Bez tego plik logu rośnie bez ograniczenia — proces chodzi tygodniami
# i pisze każdą linię postępu zadania. Skopiuj do /etc/newsyslog.d/:
#
#   sudo cp wdrozenie/pl.sygnar.studio.newsyslog.conf \
#       /etc/newsyslog.d/pl.sygnar.studio.conf
#
# Kolumny: plik, tryb, ile archiwów, rozmiar w KB, kiedy, flagi.
# `J` znaczy kompresję bzip2, `G` pozwala na wzorzec ze ścieżką.
#
# Podmień __KATALOG_LOGOW__ na ścieżkę z instalacji.
__KATALOG_LOGOW__/sygnar-studio.log   644  7  5120  *  GJ
__KATALOG_LOGOW__/kopia.log           644  4  1024  *  GJ
